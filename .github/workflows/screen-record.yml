name: Screen Record Website

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '要录制的网站 BASE_URL'
        required: true
        default: 'https://blog.amamo.top'
      total_minutes:
        description: '总时长（分钟）'
        required: true
        default: '10'
      fps:
        description: '录制帧率（x11grab 恒定帧率，建议 30，机器扛得住可 60）'
        required: true
        default: '30'

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Install ffmpeg and Xvfb
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Run record script
        env:
          SITE_BASE_URL: ${{ github.event.inputs.base_url }}
          OUT_DIR: recordings
          FPS: ${{ github.event.inputs.fps }}
        run: |
          # 起一个 1920x1080x24 的虚拟屏幕，浏览器有头跑在里面，ffmpeg 直接抓屏出 mp4
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          export DISPLAY=:99
          sleep 2
          export TOTAL_SECONDS=$(( ${{ github.event.inputs.total_minutes }} * 60 ))
          node record.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-recording
          path: recordings/full.mp4
